<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHND — Minecraft</title>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
min-height: 100vh;
background:
radial-gradient(circle at top, #172033 0%, #080b12 45%, #040509 100%);
color: #ffffff;
font-family: Arial, Helvetica, sans-serif;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
}

.container {
width: 90%;
max-width: 900px;
text-align: center;
padding: 60px 30px;
}

.logo {
font-size: clamp(4rem, 12vw, 8rem);
font-weight: 900;
letter-spacing: 0.12em;
margin-bottom: 10px;
}

.tagline {
color: #8fa3bd;
font-size: clamp(1rem, 2vw, 1.3rem);
letter-spacing: 0.25em;
text-transform: uppercase;
margin-bottom: 45px;
}

.status {
display: inline-block;
border: 1px solid #26344a;
background: rgba(15, 22, 35, 0.8);
padding: 10px 18px;
border-radius: 999px;
color: #9fb2ca;
font-size: 0.9rem;
margin-bottom: 35px;
}

.status span {
display: inline-block;
width: 8px;
height: 8px;
background: #777;
border-radius: 50%;
margin-right: 8px;
}

h1 {
font-size: clamp(2rem, 5vw, 3.5rem);
margin-bottom: 20px;
}

p {
max-width: 650px;
margin: 0 auto;
color: #aeb9c9;
line-height: 1.7;
font-size: 1.05rem;
}

.features {
display: flex;
justify-content: center;
gap: 12px;
flex-wrap: wrap;
margin-top: 40px;
}

.feature {
border: 1px solid #26344a;
background: rgba(15, 22, 35, 0.65);
padding: 12px 18px;
border-radius: 8px;
color: #c8d3e2;
font-size: 0.9rem;
}

footer {
margin-top: 55px;
color: #4f5d70;
font-size: 0.8rem;
letter-spacing: 0.08em;
}
</style>
</head>

<body>

<main class="container">

<div class="logo">DHND</div>

<div class="tagline">
Minecraft • Technology • Exploration
</div>

<div class="status">
<span></span>
Server in development
</div>

<h1>Something is being built.</h1>

<p>
DHND is a private Minecraft project focused on technology,
automation, exploration, and building a world worth getting lost in.
</p>

<div class="features">
<div class="feature">⚙ Technology</div>
<div class="feature">⛏ Automation</div>
<div class="feature">🌎 Exploration</div>
<div class="feature">🧱 Building</div>
</div>

<footer>
DHND.CA
</footer>

</main>

</body>
</html>
